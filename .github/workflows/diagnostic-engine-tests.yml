name: IronKnuckle CI / Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ironknuckle-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Full regression, page integrity and data validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full regression and page-integrity suite
        run: npm test
      - name: Validate complete fault library and catalog
        run: npm run validate:faults
