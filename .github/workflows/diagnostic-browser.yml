name: Diagnostic browser acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-diagnostic-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-browser-evidence
          path: browser-evidence/
          if-no-files-found: ignore
