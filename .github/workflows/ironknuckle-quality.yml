name: IronKnuckle quality gate
on:
  push:
    branches: [main, ironknuckle-quality-and-model-specific-learning]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate:faults
