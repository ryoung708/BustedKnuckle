name: IronKnuckle data validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/fault-studio.js
      - name: Validate fault additions
        run: node scripts/validate-fault-library.mjs
