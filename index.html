<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BustedKnuckle Studio Triage</title>
  <style>
    :root {
      --slate-black: #0c0d0e;
      --deep-titanium: #141619;
      --control-charcoal: #1e2227;
      --border-tint: #2b313a;
      --nitrogen-amber: #ff9f1c;
      --text-bright: #f0f2f5;
      --text-muted: #8a95a5;
    }

    body {
      background-color: var(--slate-black);
      color: var(--text-bright);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .master-wrapper {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
      box-sizing: border-box;
    }

    .premium-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-tint);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    .brand-logo-text {
      font-weight: 900;
      font-size: 26px;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      color: var(--text-bright);
    }

    .brand-logo-text span {
      color: var(--nitrogen-amber);
    }

    .platform-selector-pill {
      background-color: var(--control-charcoal);
      border: 1px solid var(--border-tint);
      color: var(--text-bright);
      font-weight: bold;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    .workspace-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 992px) {
      .workspace-layout {
        grid-template-columns: 1.1fr 0.9fr;
      }
    }

    .interactive-card-group {
      background-color: var(--deep-titanium);
      border: 1px solid var(--border-tint);
      border-radius: 8px;
      padding: 20px;
    }

    .card-block-title {
      font-size: 14px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .engine-fault-button-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .premium-target-btn {
      background-color: var(--control-charcoal);
      border: 1px solid var(--border-tint);
      padding: 16px 20px;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .premium-target-btn:hover {
      border-color: var(--text-muted);
    }

    .premium-target-btn.active-node {
      border-color: var(--nitrogen-amber);
      background-color: #241c10;
    }

    .btn-fault-id {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-bright);
    }

    .premium-target-btn.active-node .btn-fault-id {
      color: var(--nitrogen-amber);
    }

    .btn-fault-info {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    .diagnostic-matrix-vault {
      background-color: var(--deep-titanium);
      border: 1px solid var(--nitrogen-amber);
      border-radius: 8px;
      padding: 24px;
      align-self: start;
    }

    .status-matrix-banner {
      background-color: var(--nitrogen-amber);
      color: var(--slate-black);
      font-weight: 800;
      font-size: 13px;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
    }

    .matrix-node-segment {
      margin-bottom: 20px;
    }

    .matrix-node-segment h4 {
      font-size: 13px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 0 0 8px 0;
    }

    .circuit-value-display {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-bright);
      line-height: 1.5;
    }

    .bullet-action-stream {
      padding-left: 18px;
      margin: 8px 0 0 0;
    }

    .bullet-action-stream li {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-bright);
      margin-bottom: 8px;
    }

    .premium-affiliate-anchor {
      display: inline-block;
      background-color: var(--control-charcoal);
      border: 1px solid var(--border-tint);
      color: var(--nitrogen-amber);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 4px;
      margin-top: 8px;
      margin-right: 8px;
      text-transform: uppercase;
    }

    .premium-affiliate-anchor:hover {
      background-color: var(--border-tint);
    }

    .empty-state-notice {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      padding: 40px 0;
    }
  </style>
</head>
<body>

  <div class="master-wrapper">
    <header class="premium-header">
      <div class="brand-logo-text">Busted<span>Knuckle</span> Pro</div>
      <select class="platform-selector-pill" id="engineSelect">
        <option value="mack_mp8">MACK MP8 (13L PLATFORM)</option>
        <option value="mack_mp7">MACK MP7 (11L PLATFORM)</option>
        <option value="mack_mp10">MACK MP10 (16L HEAVY-HAUL)</option>
      </select>
    </header>

    <main class="workspace-layout">
      <section class="interactive-card-group">
        <div class="card-block-title">Select Active Bay Fault Stacking Sequence</div>
        <div class="engine-fault-button-list" id="faultListContainer"></div>
      </section>

      <section class="diagnostic-matrix-vault" id="matrixVault" style="opacity: 0.2; pointer-events: none;">
        <div class="status-matrix-banner" id="priorityIndicator">SYSTEM RUNNING MONITOR</div>
        
        <div class="matrix-node-segment">
          <h4>Shared Loop Core Intersect</h4>
          <div class="circuit-value-display" id="circuitDisplay"></div>
        </div>

        <div class="matrix-node-segment">
          <h4>Probable Diagnostic Targets</h4>
          <ul class="bullet-action-stream" id="culpritDisplayList"></ul>
        </div>

        <div class="matrix-node-segment">
          <h4>Specialized Tooling Manifest</h4>
          <div id="toolLinkManifestContainer"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { BustedKnuckleCore } from './js/app.js';
    import { faultCodeDatabase } from './js/database.js';

    let currentSelectorKey = 'mack_mp8';
    const appRuntime = new BustedKnuckleCore(currentSelectorKey);

    const selectorWidget = document.getElementById('engineSelect');
    const listContainer = document.getElementById('faultListContainer');
    const matrixVault = document.getElementById('matrixVault');

    selectorWidget.addEventListener('change', (e) => {
      currentSelectorKey = e.target.value;
      appRuntime.setEnginePlatform(currentSelectorKey);
      renderActiveFaultBlocks();
      clearDisplayMatrix();
    });

    function renderActiveFaultBlocks() {
      listContainer.innerHTML = '';
      const platformCodes = faultCodeDatabase.engines[currentSelectorKey].fault_codes;
      
      Object.keys(platformCodes).forEach(key => {
        const structuralRecord = platformCodes[key];
        const btnNode = document.createElement('div');
        btnNode.className = 'premium-target-btn';
        btnNode.innerHTML = `
          <div class="btn-fault-id">SPN ${structuralRecord.spn} // FMI ${structuralRecord.fmi}</div>
          <div class="btn-fault-info">${structuralRecord.description}</div>
        `;
        
        btnNode.onclick = () => {
          btnNode.classList.toggle('active-node');
          const operationalOutputs = appRuntime.toggleFaultCode(key);
          processOutputMatrix(operationalOutputs);
        };
        listContainer.appendChild(btnNode);
      });
    }

    function processOutputMatrix(matrix) {
      if (!matrix) {
        clearDisplayMatrix();
        return;
      }
      matrixVault.style.opacity = '1';
      matrixVault.style.pointerEvents = 'auto';
      document.getElementById('priorityIndicator').innerText = matrix.priorityCode;

      const circuitDisplay = document.getElementById('circuitDisplay');
      if (matrix.matchedCircuits.length > 0) {
        circuitDisplay.innerHTML = matrix.matchedCircuits.map(c => `
          <div style="color: var(--nitrogen-amber); margin-bottom: 4px;">${c.name}</div>
          <div style="font-size: 13px; color: var(--text-bright); font-weight: normal;">${c.triage_tip}</div>
        `).join('<br/>');
      } else {
        circuitDisplay.innerHTML = `<span style="color: var(--text-muted); font-weight: normal; font-size: 14px;">No circuit intersections located for this specific fault code stack combination.</span>`;
      }

      document.getElementById('culpritDisplayList').innerHTML = matrix.inferredCulprits.map(txt => `
        <li>${txt}</li>
      `).join('');

      document.getElementById('toolLinkManifestContainer').innerHTML = matrix.allocatedTools.map(tool => `
        <a href="${tool.affiliate_url}" target="_blank" class="premium-affiliate-anchor">🛠️ ${tool.name}</a>
      `).join('');
    }

    function clearDisplayMatrix() {
      matrixVault.style.opacity = '0.2';
      matrixVault.style.pointerEvents = 'none';
      document.getElementById('priorityIndicator').innerText = 'SYSTEM RUNNING MONITOR';
      document.getElementById('circuitDisplay').innerHTML = '';
      document.getElementById('culpritDisplayList').innerHTML = '';
      document.getElementById('toolLinkManifestContainer').innerHTML = '';
    }

    // Initial load
    renderActiveFaultBlocks();
  </script>
</body>
</html>
