<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BustedKnuckle Diagnostic Triage</title>
  <style>
    :root {
      --bg-matte-black: #0d0d0d;
      --panel-charcoal: #1a1a1a;
      --border-hard-gray: #2e2e2e;
      --text-clean-white: #f5f5f5;
      --safety-orange: #ff5722;
      --diagnostic-yellow: #ffeb3b;
    }

    body {
      background-color: var(--bg-matte-black);
      color: var(--text-clean-white);
      font-family: 'Impact', 'Arial Black', sans-serif;
      margin: 0;
      padding: 15px;
      -webkit-font-smoothing: antialiased;
    }

    .app-title {
      color: var(--safety-orange);
      font-size: 28px;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-bottom: 4px solid var(--safety-orange);
      padding-bottom: 8px;
      margin-bottom: 15px;
    }

    .platform-banner {
      width: 100%;
      background-color: var(--panel-charcoal);
      border: 2px solid var(--border-hard-gray);
      color: var(--diagnostic-yellow);
      font-size: 20px;
      padding: 15px;
      box-sizing: border-box;
      border-radius: 4px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .section-label {
      font-size: 18px;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .grid-stack {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    .code-block-btn {
      background-color: var(--panel-charcoal);
      border-left: 8px solid #444;
      border-top: 1px solid var(--border-hard-gray);
      border-right: 1px solid var(--border-hard-gray);
      border-bottom: 1px solid var(--border-hard-gray);
      padding: 20px;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
    }

    .code-block-btn.selected {
      border-left-color: var(--safety-orange);
      background-color: #24120c;
    }

    .code-header-txt {
      font-size: 22px;
      color: var(--text-clean-white);
    }

    .code-desc-txt {
      font-family: sans-serif;
      font-size: 14px;
      font-weight: bold;
      color: #999;
      margin-top: 6px;
    }

    .triage-output-panel {
      background-color: var(--panel-charcoal);
      border: 3px solid var(--safety-orange);
      padding: 20px;
      border-radius: 4px;
      margin-top: 20px;
    }

    .priority-banner {
      background-color: var(--safety-orange);
      color: var(--bg-matte-black);
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .loop-highlight-box {
      font-size: 18px;
      color: var(--diagnostic-yellow);
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px dashed #444;
    }

    .bullet-spec-list {
      padding-left: 20px;
      margin: 10px 0;
    }

    .bullet-spec-list li {
      margin-bottom: 12px;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 16px;
    }

    .affiliate-tool-button {
      display: block;
      background: #2b2b2b;
      border: 1px solid #444;
      color: var(--diagnostic-yellow);
      padding: 16px;
      margin-top: 10px;
      text-decoration: none;
      border-radius: 4px;
      font-size: 16px;
      text-transform: uppercase;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="app-title">BUSTEDKNUCKLE // MP8 DIAG</div>
  
  <div class="platform-banner">
    ACTIVE ENGINE: MACK MP8 PERFORMANCE PLATFORM
  </div>

  <div class="section-label">Tap Active Faults to Stack:</div>
  <div class="grid-stack" id="btnContainer"></div>

  <div class="triage-output-panel" id="triagePanel" style="display: none;">
    <div class="priority-banner" id="priorityStatus"></div>
    
    <div class="section-label">Shared Electrical/Mechanical Circuit Overlap:</div>
    <div id="sharedCircuitSection" class="loop-highlight-box"></div>

    <div class="section-label">Probable Diagnostic Suspects:</div>
    <ul id="suspectsList" class="bullet-spec-list"></ul>

    <div class="section-label">Required Specialty Gear:</div>
    <div id="toolKitSection"></div>
  </div>

  <script type="module">
    import { BustedKnuckleEngine } from './js/app.js';
    import { faultCodeDatabase } from './js/database.js';

    const bkApp = new BustedKnuckleEngine('mack_mp8');
    const container = document.getElementById('btnContainer');
    const panel = document.getElementById('triagePanel');

    // Dynamically build big target selection buttons for the grease bay
    Object.keys(faultCodeDatabase.engines.mack_mp8.fault_codes).forEach(key => {
      const codeData = faultCodeDatabase.engines.mack_mp8.fault_codes[key];
      const buttonElement = document.createElement('div');
      buttonElement.className = 'code-block-btn';
      buttonElement.innerHTML = `
        <div class="code-header-txt">SPN ${codeData.spn} // FMI ${codeData.fmi}</div>
        <div class="code-desc-txt">${codeData.description}</div>
      `;
      
      buttonElement.onclick = () => {
        buttonElement.classList.toggle('selected');
        const triageData = bkApp.toggleCode(key);
        updateTriageDisplay(triageData);
      };
      container.appendChild(buttonElement);
    });

    function updateTriageDisplay(data) {
      if (!data) {
        panel.style.display = 'none';
        return;
      }
      panel.style.display = 'block';
      document.getElementById('priorityStatus').innerText = data.priorityStatus;

      const circuitSection = document.getElementById('sharedCircuitSection');
      if (data.sharedCircuits.length > 0) {
        circuitSection.innerHTML = data.sharedCircuits.map(circuit => `
          <strong>${circuit.name}</strong><br/>
          <span style="font-family: sans-serif; font-size: 14px; color: #fff;">🔧 Pro-Tip: ${circuit.triage_tip}</span>
        `).join('<br/><br/>');
      } else {
        circuitSection.innerHTML = "<span style='color: var(--safety-orange);'>No shared loop detected. Isolate components individually.</span>";
      }

      document.getElementById('suspectsList').innerHTML = data.culpritTargets.map(target => `
        <li>${target}</li>
      `).join('');

      document.getElementById('toolKitSection').innerHTML = data.gearNeeded.map(tool => `
        <a href="${tool.affiliate_url}" target="_blank" class="affiliate-tool-button">🛠️ Grab: ${tool.name}</a>
      `).join('');
    }
  </script>
</body>
</html>
