<!-- ========================================== -->
<!-- SECTION 1: MASTER LAYOUT & PREMIUM STYLES  -->
<!-- ========================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IronKnuckle Diagnostics</title>
  <style>
    :root {
      --slate-black: #08090a;
      --deep-titanium: #111316;
      --control-charcoal: #1a1d22;
      --border-tint: #2c323b;
      --nitrogen-amber: #ff9f1c;
      --text-bright: #f0f2f5;
      --text-muted: #7e8b9b;
    }

    body {
      background-color: var(--slate-black);
      color: var(--text-bright);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .master-wrapper {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
      box-sizing: border-box;
    }

       /* HEADER SPACER: EXPANDED FOR MAXIMUM footprint Vertical CLEARANCE */
    .premium-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      border-bottom: 2px solid var(--border-tint);
      padding-bottom: 32px;
      margin-bottom: 32px;
    }

    @media (min-width: 768px) {
      .premium-header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center; /* Locks alignment perfectly on desktops */
      }
    }

    .brand-logo-frame {
      display: flex;
      align-items: center;
      gap: 15px;
    }

       /* THE LOGO ASSET: DRIVEN TO HIGH-VISIBILITY INDUSTRIAL SCALE */
    .brand-logo-img {
      height: 260px; /* Maxed out size for massive, aggressive shop-bay visibility */
      width: auto;
      max-width: 100%; /* Guarantees asset doesn't clip on small smartphones */
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(255, 159, 28, 0.35)); /* Boosted ambient amber halo glow */
    }

    .platform-selector-pill {
      background-color: var(--control-charcoal);
      border: 1px solid var(--border-tint);
      color: var(--text-bright);
      font-weight: bold;
      padding: 14px 20px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .platform-selector-pill:focus {
      border-color: var(--nitrogen-amber);
    }

    /* COMPONENT: SEARCH BAR ENGINE CONTROL */
    .search-container {
      width: 100%;
      margin-bottom: 24px;
    }

    .live-search-input {
      width: 100%;
      background-color: var(--deep-titanium);
      border: 2px solid var(--border-tint);
      border-radius: 8px;
      padding: 18px 24px;
      box-sizing: border-box;
      color: var(--text-bright);
      font-size: 18px;
      font-weight: bold;
      outline: none;
      transition: all 0.2s ease;
    }

    .live-search-input:focus {
      border-color: var(--nitrogen-amber);
      box-shadow: 0 0 15px rgba(255, 159, 28, 0.15);
    }

    .live-search-input::placeholder {
      color: var(--text-muted);
    }

    .workspace-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 992px) {
      .workspace-layout {
        grid-template-columns: 1.1fr 0.9fr;
      }
    }

    .interactive-card-group {
      background-color: var(--deep-titanium);
      border: 1px solid var(--border-tint);
      border-radius: 8px;
      padding: 20px;
    }

    .card-block-title {
      font-size: 13px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .engine-fault-button-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .premium-target-btn {
      background-color: var(--control-charcoal);
      border: 1px solid var(--border-tint);
      padding: 18px 20px;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .premium-target-btn:hover {
      border-color: var(--text-muted);
    }

    .premium-target-btn.active-node {
      border-color: var(--nitrogen-amber);
      background-color: #261b0c;
    }

    .btn-fault-id {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-bright);
    }

    .premium-target-btn.active-node .btn-fault-id {
      color: var(--nitrogen-amber);
    }

    .btn-fault-info {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    /* COMPONENT: RIGHT HAND SIDE DIAGNOSTIC VAULT */
    .diagnostic-matrix-vault {
      background-color: var(--deep-titanium);
      border: 1px solid var(--border-tint);
      border-radius: 8px;
      padding: 24px;
      align-self: start;
      transition: all 0.3s ease;
    }

    .diagnostic-matrix-vault.active-triage {
      border-color: var(--nitrogen-amber);
      box-shadow: 0 0 20px rgba(255, 159, 28, 0.05);
    }

    .status-matrix-banner {
      background-color: var(--control-charcoal);
      border: 1px solid var(--border-tint);
      color: var(--text-muted);
      font-weight: 800;
      font-size: 13px;
      padding: 12px;
      border-radius: 4px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }

    .status-matrix-banner.alert-active {
      background-color: var(--nitrogen-amber);
      color: var(--slate-black);
      border-color: var(--nitrogen-amber);
    }

    .matrix-node-segment {
      margin-bottom: 24px;
    }

    .matrix-node-segment h4 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin: 0 0 10px 0;
    }

    .circuit-value-display {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-bright);
      line-height: 1.5;
    }

    .bullet-action-stream {
      padding-left: 18px;
      margin: 8px 0 0 0;
    }

    .bullet-action-stream li {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-bright);
      margin-bottom: 10px;
    }

    .premium-affiliate-anchor {
      display: inline-block;
      background-color: var(--control-charcoal);
      border: 1px solid var(--border-tint);
      color: var(--nitrogen-amber);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 4px;
      margin-top: 8px;
      margin-right: 8px;
      text-transform: uppercase;
    }

    .premium-affiliate-anchor:hover {
      background-color: var(--border-tint);
    }
  </style>
</head>
<!-- ========================================== -->
<!-- SECTION 2: VIEWPORT HTML COMPONENT FRAMES  -->
<!-- ========================================== -->
<body>

  <div class="master-wrapper">
   <!-- ========================================== -->
<!-- UPDATE: ENGINE & EMISSIONS SELECTOR LABELS -->
<!-- ========================================== -->
<header class="premium-header">
  <div class="brand-logo-frame">
    <img src="logo.png" alt="IronKnuckle Diagnostics" class="brand-logo-img">
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <!-- DROPDOWN 1: MASTER ENGINE BASE -->
    <select class="platform-selector-pill" id="engineSelect">
      <option value="mack_mp8">MACK MP8 (13L PLATFORM)</option>
      <option value="mack_mp7">MACK MP7 (11L PLATFORM)</option>
      <option value="mack_mp10">MACK MP10 (16L HEAVY-HAUL)</option>
    </select>
    
    <!-- DROPDOWN 2: DYNAMIC EMISSIONS FILTER SYSTEM -->
    <select class="platform-selector-pill" id="emissionSelect">
      <!-- Injected dynamically by the script engine based on selections -->
    </select>
  </div>
</header>

    <!-- INTERFACE ELEMENT: SEARCH FIELD FILTER INPUT -->
    <div class="search-container">
      <input type="text" id="liveSearch" class="live-search-input" placeholder="SEARCH CODES... (e.g., SPN 4364, P205B, FC 239)">
    </div>

    <!-- MAIN INTERACTIVE WORKSPACE SPLIT PANELS -->
    <main class="workspace-layout">
      
      <!-- LEFT MODULE: CODES CONTAINER SELECTOR -->
      <section class="interactive-card-group">
        <div class="card-block-title">Select Active Bay Fault Stacking Sequence</div>
        <div class="engine-fault-button-list" id="faultListContainer"></div>
      </section>

      <!-- RIGHT MODULE: OUTPUT RESULTS VAULT -->
      <section class="diagnostic-matrix-vault" id="matrixVault" style="opacity: 0.25; pointer-events: none;">
        <div class="status-matrix-banner" id="priorityIndicator">SYSTEM RUNNING MONITOR</div>
        
        <div class="matrix-node-segment">
          <h4>Shared Loop Core Intersect</h4>
          <div class="circuit-value-display" id="circuitDisplay"></div>
        </div>

        <div class="matrix-node-segment">
          <h4>Probable Diagnostic Targets</h4>
          <ul class="bullet-action-stream" id="culpritDisplayList"></ul>
        </div>

        <div class="matrix-node-segment">
          <h4>Specialized Tooling Manifest</h4>
          <div id="toolLinkManifestContainer"></div>
        </div>
      </section>

    </main>
  </div>
<!-- ========================================== -->
<!-- SECTION 3: SYSTEM INTERACTIVE CONTROLLER   -->
<!-- ========================================== -->
  <script type="module">
    import { BustedKnuckleCore } from './js/app.js';
    import { faultCodeDatabase } from './js/database.js';

    let currentSelectorKey = 'mack_mp8';
    let currentEmissionKey = 'us10_us14';
    const appRuntime = new BustedKnuckleCore(currentSelectorKey);

    const selectorWidget = document.getElementById('engineSelect');
    const emissionWidget = document.getElementById('emissionSelect');
    const listContainer = document.getElementById('faultListContainer');
    const matrixVault = document.getElementById('matrixVault');
    const searchInput = document.getElementById('liveSearch');

    // CONTROL EVENT: ENGINE SELECT DROPDOWN CHANGED
    selectorWidget.addEventListener('change', (e) => {
      currentSelectorKey = e.target.value;
      appRuntime.setEnginePlatform(currentSelectorKey);
      populateEmissionDropdown();
      searchInput.value = ''; 
      renderActiveFaultBlocks();
      clearDisplayMatrix();
    });

    // CONTROL EVENT: EMISSION SELECT DROPDOWN CHANGED
    emissionWidget.addEventListener('change', (e) => {
      currentEmissionKey = e.target.value;
      searchInput.value = '';
      renderActiveFaultBlocks();
      clearDisplayMatrix();
    });

    // CONTROL EVENT: INTERACTIVE LIVE FILTER SEARCH ENGINE
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const cardNodes = listContainer.getElementsByClassName('premium-target-btn');
      
      Array.from(cardNodes).forEach(card => {
        const textContent = card.innerText.toLowerCase();
        if (textContent.includes(query)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    });

    // RUNTIME AUXILIARY: REBUILD EMISSIONS OPTION LISTS BASED ON SELECTION
    function populateEmissionDropdown() {
      emissionWidget.innerHTML = '';
      const levels = faultCodeDatabase.engines[currentSelectorKey].emission_levels;
      Object.keys(levels).forEach((key, idx) => {
        if (idx === 0) currentEmissionKey = key; // Lock first item as default active
        const opt = document.createElement('option');
        opt.value = key;
        opt.innerText = levels[key].toUpperCase();
        emissionWidget.appendChild(opt);
      });
    }

    // BUILD MECHANISM: INJECT CODES FILTERED BY EMISSIONS LEVEL INTO LIVE INTERFACE BUTTONS
    function renderActiveFaultBlocks() {
      listContainer.innerHTML = '';
      const platformCodes = faultCodeDatabase.engines[currentSelectorKey].fault_codes;
      
      Object.keys(platformCodes).forEach(key => {
        const structuralRecord = platformCodes[key];
        
        // FILTER GATEWAY: Only show codes matching selected engine AND active emissions profile
        if (structuralRecord.emission_level !== currentEmissionKey) return;

        const btnNode = document.createElement('div');
        btnNode.className = 'premium-target-btn';
        btnNode.dataset.key = key;

        // Display check: Render P-code designators alongside SPN if available
        const primaryId = structuralRecord.p_code !== "N/A" 
          ? `${structuralRecord.p_code} (SPN ${structuralRecord.spn})` 
          : `SPN ${structuralRecord.spn} // FMI ${structuralRecord.fmi}`;

        btnNode.innerHTML = `
          <div class="btn-fault-id">${primaryId}</div>
          <div class="btn-fault-info">${structuralRecord.description}</div>
        `;
        
        btnNode.onclick = () => {
          btnNode.classList.toggle('active-node');
          const operationalOutputs = appRuntime.toggleFaultCode(key);
          processOutputMatrix(operationalOutputs);
        };
        listContainer.appendChild(btnNode);
      });
    }

    // UPDATE RENDER: DISPLAY RESULTS IF FAULTS STACK MATCHES AN OVERLAP
    function processOutputMatrix(matrix) {
      if (!matrix) {
        clearDisplayMatrix();
        return;
      }
      matrixVault.style.opacity = '1';
      matrixVault.style.pointerEvents = 'auto';
      matrixVault.classList.add('active-triage');
      
      const indicator = document.getElementById('priorityIndicator');
      indicator.innerText = matrix.priorityCode;
      indicator.classList.add('alert-active');

      const circuitDisplay = document.getElementById('circuitDisplay');
      if (matrix.matchedCircuits.length > 0) {
        circuitDisplay.innerHTML = matrix.matchedCircuits.map(c => `
          <div style="color: var(--nitrogen-amber); margin-bottom: 4px; font-weight: 800;">${c.name}</div>
          <div style="font-size: 13px; color: var(--text-bright); font-weight: normal;">${c.triage_tip}</div>
        `).join('<br/>');
      } else {
        circuitDisplay.innerHTML = `<span style="color: var(--text-muted); font-weight: normal; font-size: 14px;">No circuit intersections located for this specific fault code stack combination.</span>`;
      }

      document.getElementById('culpritDisplayList').innerHTML = matrix.inferredCulprits.map(txt => `
        <li>${txt}</li>
      `).join('');

      document.getElementById('toolLinkManifestContainer').innerHTML = matrix.allocatedTools.map(tool => `
        <a href="${tool.affiliate_url}" target="_blank" class="premium-affiliate-anchor">🛠️ ${tool.name}</a>
      `).join('');
    }

    // CLEANER SYSTEM: FLUSH DATA AND LOCK VAULT PANEL WHEN NO BUTTONS ARE CHECKED
    function clearDisplayMatrix() {
      matrixVault.style.opacity = '0.25';
      matrixVault.style.pointerEvents = 'none';
      matrixVault.classList.remove('active-triage');
      
      const indicator = document.getElementById('priorityIndicator');
      indicator.innerText = 'SYSTEM RUNNING MONITOR';
      indicator.classList.remove('alert-active');
      
      document.getElementById('circuitDisplay').innerHTML = '';
      document.getElementById('culpritDisplayList').innerHTML = '';
      document.getElementById('toolLinkManifestContainer').innerHTML = '';
    }

    // INITIAL STARTUP SEQUENCE TRIGGER
    populateEmissionDropdown();
    renderActiveFaultBlocks();
  </script>
